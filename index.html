<style>
  :root[data-theme="dark"] {
    --bg: #10181A;
    --board-bg: #1B2528;
    --cell-empty: #223032;

    --ink-dim: #8FA09D;
    --accent: #E4B94E;
    --accent-fg: #2E1A05;
    --panel-bg: #1B2528;
    --panel-border: rgba(237,231,217,0.1);

    --t2-bg: #D9CCA6; --t2-fg: #2C2412;
    --t4-bg: #D3B968; --t4-fg: #2C2412;
    --t8-bg: #EAB43A; --t8-fg: #2A1B02;
    --t16-bg: #DD8A2E; --t16-fg: #2A1502;
    --t32-bg: #D8602C; --t32-fg: #FFF1E6;
    --t64-bg: #CC3F30; --t64-fg: #FFEFEA;
    --t128-bg: #9163DD; --t128-fg: #F6F1FF;
    --t256-bg: #3D82CC; --t256-fg: #EAF4FF;
    --t512-bg: #1FAE8E; --t512-fg: #E9FBF5;
    --t1024-bg: #17CBA0; --t1024-fg: #04241C;
    --t2048-bg: #FFD24D; --t2048-fg: #2A1B02;
  }
  :root[data-theme="light"] {
    --bg: #F4EFE1;
    --board-bg: #EAE1C9;
    --cell-empty: #DED2B0;
    --ink: #2E2A20;
    --ink-dim: #8A8168;
    --accent: #B8763F;
    --accent-fg: #FFF8EC;
    --panel-bg: #FBF7ED;

    --t2-bg: #E8DFC8; --t2-fg: #3A3220;
    --t4-bg: #DCC98F; --t4-fg: #3A3220;
    --t8-bg: #E4B94E; --t8-fg: #3A2A08;
    --t16-bg: #C98A3F; --t16-fg: #2E1A05;
    --t32-bg: #B85E3A; --t32-fg: #FFF3EA;
    --t64-bg: #9A4632; --t64-fg: #FFEFE8;
    --t128-bg: #6C4E93; --t128-fg: #F3EEFC;
    --t256-bg: #3D5A80; --t256-fg: #EAF1FA;
    --t512-bg: #2E7D6B; --t512-fg: #E7F7F1;
    --t1024-bg: #23997F; --t1024-fg: #EAFBF6;
    --t2048-bg: #F2C14E; --t2048-fg: #2E1A05;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
  overscroll-behavior-y: none;
  }

  .wrap { width: 100%; max-width: 420px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    gap: 8px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(28px, 9vw, 36px);
    margin: 0;
    letter-spacing: -0.5px;
  }
  h1 span { color: var(--accent); }

  .subtitle { font-size: 12.5px; color: var(--ink-dim); margin: 4px 0 0; }
  .subtitle a { color: var(--ink-dim); text-decoration: underline; }
  .subtitle a:hover { color: var(--accent); }

  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .icon-row { display: flex; gap: 6px; }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: var(--panel-bg);
    color: var(--ink);
    cursor: pointer;

    font-size: 16px;
  }
  .icon-btn:active { transform: scale(0.92); }

  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 6px 12px;
    text-align: center;
    min-width: 58px;
  }
  .score-label { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-dim); margin: 0 0 2px; }
  .score-value { font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; margin: 0; }

  .toolbar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 14px; gap: 8px; }

  button.pill {
    font-family: 'Inter', sans-serif;
    font-weight: 600;

    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.pill:active { transform: scale(0.96); }

  .board-frame {
    position: relative;
    background: var(--board-bg);
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
    /* Блокируем только на рамке игрового поля */
    touch-action: none;
  }

  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    aspect-ratio: 1 / 1;
    /* Блокируем только на доске */
    touch-action: none;
  }

  .cell-bg { background: var(--cell-empty); border-radius: 10px; }

  .tiles-layer { position: absolute; inset: 0; }

  .tile {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    transition: top 0.1s cubic-bezier(0.2, 0.8, 0.3, 1), left 0.1s cubic-bezier(0.2, 0.8, 0.3, 1);
    transform: translateZ(0);
    backface-visibility: hidden;
    will-change: top, left;
  }

  .tile-pop { animation: pop 0.15s ease-out; }
  .tile-merge { animation: merge 0.18s ease-out; }
  @keyframes pop { 0% { transform: scale(0.35) translateZ(0); } 100% { transform: scale(1) translateZ(0); } }
  @keyframes merge { 0% { transform: scale(1) translateZ(0); } 55% { transform: scale(1.18) translateZ(0); } 100% { transform: scale(1) translateZ(0); } }

  .toast {
    position: absolute;
    top: 14px; left: 50%;
    transform: translate(-50%, -12px);
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 15;
    max-width: 88%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.game-logo {
  width: 48px;
  height: 48px;
  object-fit: contain;
  border-radius: 10px;
  display: block;
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-text a {
  color: var(--ink-dim);
  text-decoration: underline;
  font-size: 12.5px;
}

.brand-text a:hover {
  color: var(--accent);
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  background: rgba(16,24,26,0.94);

  border-radius: 16px;

  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  gap: 14px;

  z-index: 10;

  padding: 24px;
}

:root[data-theme="light"] .overlay {
  background: rgba(244,239,225,0.96);
}

.overlay.show {
  display: flex;
}

.overlay h2 {
  font-family: 'Fraunces', serif;
  font-size: 28px;
  margin: 0;
  color: var(--ink);
}

.overlay p {
  color: var(--ink-dim);
  margin: 0;
  font-size: 13.5px;
}

.overlay-buttons {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 220px;
  gap: 8px;
}

.overlay-buttons .pill {
  width: 100%;
}

.secondary-pill {
  background: var(--panel-bg) !important;
  color: var(--ink) !important;

}

.channel-link {
  display: flex;
  align-items: center;

  color: var(--ink-dim);

}

.channel-link:hover {

}

.channel-link img {
  width: 34px;
  height: 34px;

  object-fit: cover;

  border-radius: 9px;

  display: block;
}

<script>
const SIZE = 4;
let grid, score, best, tileId, over, tiles, reached2048 = false;
let muted = false;
let audioCtx = null;

const boardEl = document.getElementById('board');
const tilesLayer = document.getElementById('tilesLayer');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlaySubtitle = document.getElementById('overlaySubtitle');
const toastEl = document.getElementById('toast');
const soundBtn = document.getElementById('soundToggle');

  const pauseBtn = document.getElementById('pauseToggle');
const overlayContinue = document.getElementById('overlayContinue');
const overlayExit = document.getElementById('overlayExit');

let paused = false;

const tileColors = {
  2: ['--t2-bg', '--t2-fg'], 4: ['--t4-bg', '--t4-fg'], 8: ['--t8-bg', '--t8-fg'],
  16: ['--t16-bg', '--t16-fg'], 32: ['--t32-bg', '--t32-fg'], 64: ['--t64-bg', '--t64-fg'],
  128: ['--t128-bg', '--t128-fg'], 256: ['--t256-bg', '--t256-fg'], 512: ['--t512-bg', '--t512-fg'],
  1024: ['--t1024-bg', '--t1024-fg'], 2048: ['--t2048-bg', '--t2048-fg']
};

let cellSize = 0, gridGap = 12;

function computeCellSize() {
  const rect = boardEl.getBoundingClientRect();
  cellSize = (rect.width - gridGap * (SIZE - 1)) / SIZE;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

  function togglePause(force) {
  if (over) return;

  paused = typeof force === 'boolean'
    ? force
    : !paused;

  if (paused) {
    overlayTitle.textContent = 'Пауза';
    overlaySubtitle.textContent = 'Игра приостановлена';

    overlayContinue.style.display = 'block';
    overlayRestart.style.display = 'block';
    overlayExit.style.display = 'block';

    overlay.classList.add('show');

    pauseBtn.textContent = '▶';
  } else {
    overlay.classList.remove('show');

    pauseBtn.textContent = '⏸';
  }
}

// ---------- localStorage ----------
const storage = {
  get: (key) => {
    try {
      const value = localStorage.getItem('2048_' + key);
      return value ? { value: value } : null;
    } catch (e) {
      return null;
    }
  },
  set: (key, value) => {
    try {
      localStorage.setItem('2048_' + key, value);
    } catch (e) {
      console.error('save failed', e);
    }
  }
};
window.storage = storage;

// ---------- Sound ----------
function ensureAudio() {
  if (audioCtx) return audioCtx;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
  } catch (e) {
    audioCtx = null;
  }
  return audioCtx;
}

function playTone(freq, duration, type, gainPeak) {
  if (muted) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.12, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  } catch (e) {
    console.error('sound playback failed', e);
  }
}

function soundMove() { playTone(320, 0.05, 'sine', 0.06); }
function soundMerge(value) {
  const pitch = 440 + Math.min(Math.log2(value || 2) * 30, 260);
  playTone(pitch, 0.12, 'triangle', 0.1);
}
function soundGameOver() { playTone(180, 0.35, 'sine', 0.08); }
function soundWin() {
  playTone(660, 0.14, 'triangle', 0.1);
  setTimeout(() => playTone(880, 0.18, 'triangle', 0.1), 110);
}

async function initSound() {
  try {
    const res = storage.get('sound-muted');
    muted = !!(res && res.value === '1');
  } catch (e) {
    muted = false;
  }
  soundBtn.textContent = muted ? '🔇' : '🔊';
}

soundBtn.addEventListener('click', async () => {
  muted = !muted;
  soundBtn.textContent = muted ? '🔇' : '🔊';
  ensureAudio();
  try { storage.set('sound-muted', muted ? '1' : '0'); } catch (e) { console.error('mute save failed', e); }
  if (!muted) playTone(440, 0.08, 'sine', 0.08);
});

  pauseBtn.addEventListener('click', () => {
  ensureAudio();

  if (over) return;

  togglePause();
});

  overlayContinue.addEventListener('click', () => {
  ensureAudio();
  togglePause(false);
});

  overlayExit.addEventListener('click', () => {
  try {
    if (
      window.Telegram &&
      window.Telegram.WebApp &&
      typeof window.Telegram.WebApp.close === 'function'
    ) {
      window.Telegram.WebApp.close();
      return;
    }
  } catch (e) {
    console.error('Telegram close failed:', e);
  }

  showToast('Доступно внутри Telegram');
});

// ---------- Theme ----------
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☾' : '☼';
}

async function initTheme() {
  let theme = 'dark';
  try {
    const res = storage.get('theme');
    if (res && res.value) theme = res.value;
    else theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  } catch (e) {
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  applyTheme(theme);
}

document.getElementById('themeToggle').addEventListener('click', async () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { storage.set('theme', next); } catch (e) { console.error('theme save failed', e); }
});

// ---------- Best score ----------
async function loadBest() {
  try {
    const res = storage.get('best-score');
    best = res && res.value ? (parseInt(res.value) || 0) : 0;
  } catch (e) {
    best = 0;
  }
  bestEl.textContent = best;
}

async function saveBest(value) {
  best = value;
  bestEl.textContent = best;
  try { storage.set('best-score', String(best)); } catch (e) { console.error('best save failed', e); }
}

// ---------- Game logic ----------
function initGame() {
  grid = Array.from({length: SIZE}, () => Array(SIZE).fill(null));
  tiles = [];
  tileId = 0;
  score = 0;
  over = false;
  paused = false;
  reached2048 = false;
  pauseBtn.textContent = '⏸';
  overlay.classList.remove('show');
  scoreEl.textContent = 0;
  addRandomTile();
  addRandomTile();
  render();
}

function emptyCells() {
  const cells = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (!grid[r][c]) cells.push([r, c]);
  return cells;
}

function addRandomTile() {
  const cells = emptyCells();
  if (!cells.length) return;
  const [r, c] = cells[Math.floor(Math.random() * cells.length)];
  const value = Math.random() < 0.9 ? 2 : 4;
  const tile = { id: tileId++, r, c, value, merged: false };
  grid[r][c] = tile;
  tiles.push(tile);
}

const SLIDE_MS = 100;

function render() {
  computeCellSize();
  tilesLayer.querySelectorAll('.tile').forEach(el => {
    const id = parseInt(el.dataset.id);
    if (!tiles.find(t => t.id === id)) el.remove();
  });

  const mergedEls = [];

  tiles.forEach(t => {
    let el = tilesLayer.querySelector(`[data-id="${t.id}"]`);
    let isNew = false;
    if (!el) {
      el = document.createElement('div');
      el.className = 'tile tile-pop';
      el.dataset.id = t.id;
      tilesLayer.appendChild(el);
      isNew = true;
    }
    const [bgVar, fgVar] = tileColors[t.value] || tileColors[2048];
    el.style.width = cellSize + 'px';
    el.style.height = cellSize + 'px';
    el.style.left = Math.round(t.c * (cellSize + gridGap)) + 'px';
    el.style.top = Math.round(t.r * (cellSize + gridGap)) + 'px';
    el.style.background = `var(${bgVar})`;
    el.style.color = `var(${fgVar})`;
    el.style.fontSize = (t.value > 512 ? cellSize * 0.32 : cellSize * 0.4) + 'px';
    el.textContent = t.value;
    if (t.merged && !isNew) mergedEls.push(el);
    t.merged = false;
  });

  if (mergedEls.length) {
    setTimeout(() => {
      mergedEls.forEach(el => {
        el.classList.remove('tile-merge');
        void el.offsetWidth;
        el.classList.add('tile-merge');
        el.addEventListener('animationend', () => el.classList.remove('tile-merge'), { once: true });
      });
    }, SLIDE_MS);
  }
}

function cloneGridValues() {
  return grid.map(row => row.map(cell => cell ? cell.value : 0));
}

function move(direction) {
  if (over || paused) return;
  const before = cloneGridValues();
  let anyMerge = false;
  let mergedValue = 0;

  function lineCells(direction, idx) {
    const cells = [];
    for (let i = 0; i < SIZE; i++) {
      if (direction === 'left') cells.push([idx, i]);
      if (direction === 'right') cells.push([idx, SIZE - 1 - i]);
      if (direction === 'up') cells.push([i, idx]);
      if (direction === 'down') cells.push([SIZE - 1 - i, idx]);
    }
    return cells;
  }

  for (let idx = 0; idx < SIZE; idx++) {
    const cells = lineCells(direction, idx);
    let lineTiles = cells.map(([r, c]) => grid[r][c]).filter(Boolean);
    const merged = [];
    for (let i = 0; i < lineTiles.length; i++) {
      if (i < lineTiles.length - 1 && lineTiles[i].value === lineTiles[i+1].value && !lineTiles[i].justMerged) {
        const t1 = lineTiles[i], t2 = lineTiles[i+1];
        t1.value *= 2;
        t1.merged = true;
        t1.justMerged = true;
        score += t1.value;
        anyMerge = true;
        mergedValue = Math.max(mergedValue, t1.value);
        tiles = tiles.filter(t => t.id !== t2.id);
        merged.push(t1);
        i++;
      } else {
        merged.push(lineTiles[i]);
      }
    }
    for (let i = 0; i < SIZE; i++) {
      const [r, c] = cells[i];
      grid[r][c] = null;
    }
    merged.forEach((t, i) => {
      const [r, c] = cells[i];
      t.r = r; t.c = c;
      grid[r][c] = t;
    });
  }

  tiles.forEach(t => t.justMerged = false);

  const after = cloneGridValues();
  const moved = JSON.stringify(before) !== JSON.stringify(after);

  if (moved) {
    scoreEl.textContent = score;
    if (score > best) saveBest(score);
    addRandomTile();
    render();
    if (anyMerge) setTimeout(() => soundMerge(mergedValue), SLIDE_MS); else soundMove();
    checkGameState();
  }
}

function checkGameState() {
  if (!reached2048) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] && grid[r][c].value === 2048) {
          reached2048 = true;
          showToast('Есть 2048! Можно играть дальше');
          soundWin();
          break;
        }
  }

  if (emptyCells().length) return;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = grid[r][c].value;
      if (c < SIZE - 1 && grid[r][c+1].value === v) return;
      if (r < SIZE - 1 && grid[r+1][c].value === v) return;
    }
  }

   over = true;
  paused = false;

  pauseBtn.textContent = '⏸';

  overlayTitle.textContent = 'Игра окончена';
  overlaySubtitle.textContent = 'Больше нет ходов — счёт: ' + score;

  overlayContinue.style.display = 'none';
  overlayRestart.style.display = 'block';
  overlayExit.style.display = 'block';

  overlay.classList.add('show');

  soundGameOver();
}

document.addEventListener('keydown', e => {
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  if (map[e.key]) {
    e.preventDefault();
    ensureAudio();
    move(map[e.key]);
  }
});

// ---------- СВАЙПЫ ПО ИГРОВОМУ ПОЛЮ ----------
let touchStartX = 0;
let touchStartY = 0;
let touchMoved = false;

boardEl.addEventListener('touchstart', (e) => {
  if (paused || over) return;

  const touch = e.touches[0];

  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchMoved = false;

  ensureAudio();
}, { passive: true });


boardEl.addEventListener('touchmove', (e) => {
  if (paused || over) return;

  e.preventDefault();
  touchMoved = true;
}, { passive: false });


boardEl.addEventListener('touchend', (e) => {
  if (paused || over || !touchMoved) return;

  const touch = e.changedTouches[0];

  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) {
    return;
  }

  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? 'right' : 'left');
  } else {
    move(dy > 0 ? 'down' : 'up');
  }
}, { passive: false });

  // ---------- СВАЙП СВЕРХУ ДЛЯ ЗАКРЫТИЯ ----------
const header = document.querySelector('header');

let headerTouchStartY = 0;
let headerTouchStartX = 0;

header.addEventListener('touchstart', (e) => {
  const touch = e.touches[0];

  headerTouchStartX = touch.clientX;
  headerTouchStartY = touch.clientY;
}, { passive: true });


header.addEventListener('touchend', (e) => {
  const touch = e.changedTouches[0];

  const dx = touch.clientX - headerTouchStartX;
  const dy = touch.clientY - headerTouchStartY;

  // Только вертикальный свайп вниз
  if (
    dy > 70 &&
    Math.abs(dy) > Math.abs(dx)
  ) {
    try {
      if (
        window.Telegram &&
        window.Telegram.WebApp &&
        typeof window.Telegram.WebApp.close === 'function'
      ) {
        window.Telegram.WebApp.close();
      }
    } catch (err) {
      console.error('Telegram close failed:', err);
    }
  }
}, { passive: true });
  
// НЕ БЛОКИРУЕМ свайпы на всей странице — оставляем как обычно
// Это позволяет сворачивать игру свайпом вниз за пределами поля

document.getElementById('newGame').addEventListener('click', () => { ensureAudio(); initGame(); });
document.getElementById('overlayRestart').addEventListener('click', () => {
  ensureAudio();
  paused = false;
  pauseBtn.textContent = '⏸';
  initGame();
});
window.addEventListener('resize', render);

(async function start() {
  await initTheme();
  await initSound();
  await loadBest();
  initGame();
})();
</script>
